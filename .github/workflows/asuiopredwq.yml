name: Windows KVM in Docker (Approach B on Ubuntu Runner)

on:
  workflow_dispatch:
    inputs:
      windows_version:
        description: "Windows Edition (tiny10, win10, win11)"
        required: true
        default: "tiny10"
      tunnel_service:
        description: "Expose Web Desktop Port 8006 (cloudflared or tmate)"
        required: true
        default: "cloudflared"

jobs:
  launch-windows-node:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify & Enable KVM Permissions
        run: |
          echo "[+] Checking KVM hardware availability..."
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -la /dev/kvm
            echo "✅ /dev/kvm is ACTIVE and accessible!"
          else
            echo "❌ /dev/kvm not found!"
            exit 1
          fi

      - name: Start tmate Interactive SSH & Web Shell Session
        uses: mxschmitt/action-tmate@v3
        with:
          detached: true
          limit-access-to-actor: false

      - name: Send Shell Links to Discord & Console
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          sleep 3
          TMATE_SSH=$(tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}' 2>/dev/null || true)
          TMATE_WEB=$(tmate -S /tmp/tmate.sock display -p '#{tmate_web}' 2>/dev/null || true)
          echo "=================================================================="
          echo "⚡ TMATE SSH & WEB TERMINAL ARE READY!"
          echo "   SSH Command:    $TMATE_SSH"
          echo "   Web Shell URL:  $TMATE_WEB"
          echo "=================================================================="
          echo "tmate_ssh=$TMATE_SSH" >> $GITHUB_ENV
          echo "tmate_web=$TMATE_WEB" >> $GITHUB_ENV

          if [ -n "$DISCORD_WEBHOOK_URL" ] && [ -n "$TMATE_WEB" ]; then
            echo "[+] Sending tmate SSH & Web Terminal links to Discord..."
            curl -s -H "Content-Type: application/json" -X POST -d "{\"content\": \"⚡ Windows Runner Interactive Shell is READY**\n\n💻 **SSH Command: \`$TMATE_SSH\`\n🌐 Web Terminal: $TMATE_WEB\n⏱️ Runner: GitHub Actions (Ubuntu x86_64)\"}" "$DISCORD_WEBHOOK_URL" || true
          fi

      - name: Install Cloudflared Tunnel
        run: |
          curl -sL --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          rm cloudflared.deb

      - name: Launch dockurr/windows Container with KVM
        run: |
          docker run -d \
            --name votify-windows-node \
            --device /dev/kvm \
            --cap-add NET_ADMIN \
            -p 8006:8006 \
            -p 3389:3389 \
            -e VERSION="${{ github.event.inputs.windows_version }}" \
            -e RAM_SIZE="4G" \
            -e CPU_CORES="2" \
            -e DISK_SIZE="24G" \
            dockurr/windows:latest

          echo "[+] Container launched. Checking initial container logs..."
          sleep 5
          docker logs votify-windows-node | head -n 25

      - name: Expose Windows Web Desktop (Port 8006) via Cloudflare Tunnel
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          echo "=================================================================="
          echo "🌐 STARTING PUBLIC SECURE TUNNEL TO WINDOWS WEB DESKTOP..."
          echo "=================================================================="
          cloudflared tunnel --url http://127.0.0.1:8006 > tunnel.log 2>&1 &
          
          # Wait for public URL to appear in tunnel.log
          for i in {1..30}; do
            TUNNEL_URL=$(grep -o "https://[a-zA-Z0-9-]*\.trycloudflare\.com" tunnel.log | head -n 1 || true)
            if [ -n "$TUNNEL_URL" ]; then
              echo "🎉 SUCCESS! Your Windows Web Desktop is LIVE at:"
              echo ""
              echo "      👉 $TUNNEL_URL 👈"
              echo ""
              echo "Open this link in your browser to view and control Windows in real-time!"

              if [ -n "$DISCORD_WEBHOOK_URL" ]; then
                echo "[+] Sending Desktop URL directly to Discord..."
                curl -s -H "Content-Type: application/json" -X POST -d "{\"content\": \"🚀 Windows KVM Node LIVE (Approach B)**\n\n🖥️ **Web Desktop: $TUNNEL_URL\n💻 SSH: \`$tmate_ssh\`\n🌐 Web Shell: $tmate_web\n⚡ KVM Acceleration: ENABLED (/dev/kvm)\"}" "$DISCORD_WEBHOOK_URL" || true
              fi
              break
            fi
            sleep 2
          done

      - name: Keep Runner Alive For Interactive Work
        run: |
          echo "=================================================================="
          echo "🟢 Runner session is ACTIVE. Connect via tmate or Web Desktop!"
          echo "   SSH:     $tmate_ssh"
          echo "   Web:     $tmate_web"
          echo "=================================================================="
          # Wait while tmate session is open
          while tmate -S /tmp/tmate.sock has-session 2>/dev/null; do
            sleep 10
          done
