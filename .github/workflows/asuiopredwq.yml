name: Windows KVM in Docker (Approach B on Ubuntu Runner)

on:
  workflow_dispatch:
    inputs:
      windows_version:
        description: "Windows Edition (win10, win11, ltsc10, tiny10)"
        required: true
        default: "win10"

      tunnel_service:
        description: "Expose Web Desktop Port 8006 (cloudflared or tmate)"
        required: true
        default: "cloudflared"

jobs:
  launch-windows-node:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Host & Install Dependencies
        run: |
          echo "[+] Checking KVM hardware acceleration..."
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -la /dev/kvm
            echo "✅ /dev/kvm is ACTIVE and accessible!"
          else
            echo "❌ /dev/kvm not found! Ensure runner supports nested virtualization."
            exit 1
          fi

          echo "[+] Installing cloudflared..."
          curl -sL --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          rm cloudflared.deb

          echo "[+] Installing standalone ttyd web terminal..."
          sudo curl -sLo /usr/local/bin/ttyd https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64
          sudo chmod +x /usr/local/bin/ttyd

      - name: Launch Windows Node, Tunnels & Keep-Alive
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          echo "=================================================================="
          echo "🚀 1. LAUNCHING DOCKURR/WINDOWS CONTAINER..."
          echo "=================================================================="
          docker run -d \
            --name votify-windows-node \
            --device /dev/kvm \
            --cap-add NET_ADMIN \
            -p 8006:8006 \
            -p 3389:3389 \
            -p 8080:8080 \
            -e VERSION="${{ github.event.inputs.windows_version }}" \
            -e RAM_SIZE="4G" \
            -e CPU_CORES="2" \
            -e DISK_SIZE="24G" \
            dockurr/windows:latest

          echo "=================================================================="
          echo "🌐 2. STARTING TTYD WEB TERMINAL & TUNNEL (PORT 7681)..."
          echo "=================================================================="
          ttyd -p 7681 --writable bash > ttyd.log 2>&1 &
          cloudflared tunnel --url http://127.0.0.1:7681 > ttyd_tunnel.log 2>&1 &

          echo "=================================================================="
          echo "🖥️ 3. STARTING WINDOWS WEB DESKTOP TUNNEL (PORT 8006)..."
          echo "=================================================================="
          cloudflared tunnel --url http://127.0.0.1:8006 > desktop_tunnel.log 2>&1 &

          echo "[+] Waiting for Cloudflare tunnel URLs to resolve..."
          TTYD_URL=""
          DESKTOP_URL=""
          for i in {1..35}; do
            if [ -z "$TTYD_URL" ]; then
              TTYD_URL=$(grep -o "https://[a-zA-Z0-9-]*\.trycloudflare\.com" ttyd_tunnel.log 2>/dev/null | head -n 1 || true)
            fi
            if [ -z "$DESKTOP_URL" ]; then
              DESKTOP_URL=$(grep -o "https://[a-zA-Z0-9-]*\.trycloudflare\.com" desktop_tunnel.log 2>/dev/null | head -n 1 || true)
            fi
            if [ -n "$TTYD_URL" ] && [ -n "$DESKTOP_URL" ]; then
              break
            fi
            sleep 1
          done

          echo ""
          echo "=================================================================="
          echo "🎉 LIVE SERVICES READY!"
          echo "   🌐 Web Terminal (Bash):    $TTYD_URL"
          echo "   🖥️ Windows Web Desktop:     $DESKTOP_URL"
          echo "=================================================================="
          echo ""

          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            echo "[+] Dispatching links to Discord..."
            curl -s -H "Content-Type: application/json" -X POST -d "{\"content\": \"🚀 **Windows KVM Node & Web Terminal LIVE**\n\n🖥️ **Windows Desktop:** $DESKTOP_URL\n🌐 **Web Terminal:** $TTYD_URL\n⚡ **KVM Acceleration:** ENABLED (/dev/kvm)\n⏱️ **Runner:** GitHub Actions\"}" "$DISCORD_WEBHOOK_URL" || true
          fi

          echo "=================================================================="
          echo "📜 STREAMING WINDOWS CONTAINER LOGS (ACTIVE UP TO 6 HOURS)..."
          echo "=================================================================="
          docker logs -f votify-windows-node &
          
          # Keep step running continuously for the full 6-hour runner limit
          sleep 21600



